services:
  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app_db

  backend:
    build: ./backend
    ports:
      - "8000:8000"

  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_DB=app_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
